name: Deploy course dashboard

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Write fork-aware site config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          owner, repo = "${{ github.repository }}".split("/", 1)
          pages_url = f"https://{owner}.github.io/{repo}/"
          Path("site/config.json").write_text(
              json.dumps(
                  {
                      "owner": owner,
                      "repo": repo,
                      "branch": "${{ github.ref_name }}",
                      "pagesUrl": pages_url,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
